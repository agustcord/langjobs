<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>LangJobs</title>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">LJ</span>
      <div>
        <h1>LangJobs</h1>
        <p class="subtitle">Filtro de vacantes por idioma</p>
      </div>
    </div>
  </header>

  <main>
    <section class="toggle-row">
      <div class="toggle-label">
        <span class="toggle-title">Etiquetado activado</span>
        <span class="toggle-hint">Muestra un badge ES / EN en cada vacante de LinkedIn.</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabled" />
        <span class="slider"></span>
      </label>
    </section>

    <p class="note">
      Las vacantes se etiquetan en <code>linkedin.com/jobs/</code>. El idioma que se
      mantiene visible es <strong>español</strong>; las de inglés reciben badge <strong>EN</strong>.
    </p>
  </main>

  <footer>
    <a href="https://github.com/agustcord/langjobs" target="_blank" rel="noopener">LangJobs en GitHub</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
