<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Concept 3: Split pill badge ES (blue) / EN (green) -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="#0a66c2"/>
  <!-- Pill container -->
  <rect x="96" y="190" width="320" height="132" rx="66" ry="66" fill="#ffffff"/>
  <!-- Left half blue (ES) -->
  <path d="M 96,190 L 256,190 L 256,322 L 96,322 Q 96,190 96,190 Z" fill="#0a66c2"/>
  <rect x="96" y="190" width="160" height="132" rx="66" ry="66" fill="#0a66c2"/>
  <!-- Right half green (EN) -->
  <rect x="256" y="190" width="160" height="132" rx="66" ry="66" fill="#057642"/>
  <!-- White center divider -->
  <rect x="250" y="190" width="12" height="132" fill="#ffffff"/>
</svg>
