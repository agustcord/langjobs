<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Concept 5: LJ lettermark with diagonal split (blue top / green bottom) -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="#0a66c2"/>
  <!-- Diagonal green wedge -->
  <path d="M 24,488 L 488,488 L 488,300 L 24,420 Z" fill="#057642"/>
  <!-- White LJ monogram (same geometry as before) -->
  <g fill="#ffffff">
    <rect x="118" y="104" width="74" height="232"/>
    <rect x="118" y="286" width="176" height="74"/>
    <rect x="300" y="104" width="74" height="166"/>
    <rect x="232" y="270" width="142" height="74"/>
    <rect x="232" y="232" width="58" height="44"/>
  </g>
</svg>
