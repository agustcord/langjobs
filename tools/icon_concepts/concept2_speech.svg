<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Concept 2: Speech bubble split ES (blue top) / EN (green bottom) -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="#ffffff"/>
  <!-- Bubble body -->
  <path d="M 110,110 L 402,110 Q 420,110 420,140 L 420,330 Q 420,360 390,360 L 200,360 L 150,410 L 150,360 L 130,360 Q 100,360 100,330 L 100,140 Q 100,110 130,110 Z" fill="#0a66c2"/>
  <!-- Green lower half (EN) -->
  <path d="M 100,235 L 420,235 L 420,330 Q 420,360 390,360 L 200,360 L 150,410 L 150,360 L 130,360 Q 100,360 100,330 Z" fill="#057642"/>
  <!-- White tail separation line -->
  <rect x="100" y="228" width="320" height="14" fill="#ffffff"/>
</svg>
