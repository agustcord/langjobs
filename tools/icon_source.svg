<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- LangJobs icon — Concept A: LJ monogram on blue tile with green accent bar.
       Geometric (no font dependency). Bold strokes for legibility at 16px.
       Colors: brand/ES blue #0a66c2, EN green #057642 (matches product badges). -->

  <!-- Blue rounded tile (solid body; corners are transparent = standard Chrome icon) -->
  <rect x="24" y="24" width="464" height="464" rx="96" ry="96" fill="#0a66c2"/>

  <!-- Green accent bar at bottom (rounded bottom corners matching tile) -->
  <path d="M 24,398 L 24,388 Q 24,488 124,488 L 388,488 Q 488,488 488,388 L 488,398 Z" fill="#057642"/>

  <!-- White "LJ" monogram — bold, generous gaps for small-size legibility -->
  <g fill="#ffffff">
    <!-- Letter L: thick vertical + thick base -->
    <rect x="118" y="104" width="74" height="232"/>
    <rect x="118" y="286" width="176" height="74"/>

    <!-- Letter J: thick vertical + foot to the left + small hook up -->
    <rect x="300" y="104" width="74" height="166"/>
    <rect x="232" y="270" width="142" height="74"/>
    <rect x="232" y="232" width="58" height="44"/>
  </g>
</svg>
